# stackping — example service configuration
# Copy to services.yaml and customise.

# Optional: default values applied to every service unless overridden.
default_interval: 60   # seconds between health checks
default_timeout: 10    # HTTP request timeout in seconds

# Webhook URL that receives alert payloads (POST JSON).
# Leave blank to disable webhook notifications.
webhook_url: "https://hooks.example.com/services/YOUR/WEBHOOK/TOKEN"

services:
  - name: "Homepage"
    url: "https://example.com"
    interval: 60
    timeout: 10
    expected_status: 200
    tags:
      - production
      - web

  - name: "API Health"
    url: "https://api.example.com/health"
    interval: 30
    timeout: 5
    expected_status: 200
    tags:
      - production
      - api

  - name: "Staging Site"
    url: "https://staging.example.com"
    interval: 120
    expected_status: 200
    tags:
      - staging
