# stackping — example service configuration
# Copy this file to services.yaml and adjust to your needs.

global:
  interval: 60          # seconds between checks (default for all services)
  webhook_url: "https://hooks.example.com/services/XXX/YYY/ZZZ"

services:
  - name: Homepage
    url: https://example.com
    expected_status: 200

  - name: API health
    url: https://api.example.com/health
    expected_status: 200
    interval: 30          # override global interval for this service
    timeout: 5

  - name: Admin panel
    url: https://admin.example.com
    expected_status: 200
    timeout: 10

  - name: Metrics endpoint
    url: https://metrics.example.com/metrics
    expected_status: 200
    interval: 120

  - name: Legacy redirect
    url: https://old.example.com
    expected_status: 301

  - name: CDN assets
    url: https://cdn.example.com/ping
    expected_status: 204
    timeout: 3
    interval: 90
